name: Daily GeekNews digest

on:
  schedule:
    # 매일 21:00 UTC = 한국시간(KST) 06:00
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: GeekNews 피드 가져오기
        run: python scripts/fetch_geeknews.py

      - name: 변경 사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- assets/news-feed.json; then
            echo "변경 없음 — 커밋 생략"
          else
            git add assets/news-feed.json
            git commit -m "chore: GeekNews 오늘의 소식 갱신"
            git push
          fi
